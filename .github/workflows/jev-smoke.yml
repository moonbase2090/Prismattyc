# SPDX-License-Identifier: MPL-2.0
name: Jev smoke

# Manual smoke test: one trivial Jev request through Cloudflare AI Gateway with the
# same secrets as the nightly jev-shadow job. Costs well under one cent per run.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Also run read-only token/gateway checks and header variants on 403
        type: boolean
        default: false
  push:
    branches: [fix/jev-gateway-smoke]

permissions:
  contents: read

concurrency:
  group: jev-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Jev smoke request
    if: ${{ github.repository == 'moonbase2090/Prismattyc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, Node 24
        with:
          persist-credentials: false

      - name: Send one Jev request
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
          CLOUDFLARE_AI_GATEWAY_ID: ${{ secrets.CLOUDFLARE_AI_GATEWAY_ID }}
          PROBE: ${{ github.event_name == 'push' || inputs.probe }}
        run: |
          set -euo pipefail
          python3 scripts/jev-smoke.py
          if [[ "$PROBE" == "true" ]]; then
            python3 scripts/jev-smoke.py --probe
          fi
