manifest_version = 1
id = "org.moonbase.activity-monitor"
version = "1.4.0"
plugin_api = "^2.0.0"
component = "monitor.wasm"
notices = [
    "LICENSE",
    "fonts/IBMPlexSans-OFL.txt",
    "fonts/Inter-OFL.txt",
    "fonts/JetBrainsMono-OFL.txt",
    "fonts/NotoEmoji-OFL.txt",
    "fonts/NotoSans-OFL.txt",
]

[requires]
"pmux:activity/read" = "^1.0.0"
"pmux:activity/manage" = "^1.3.0"
"pmux:view/frame" = "^2.0.0"
"pmux:theme/colors" = "^1.0.0"

[[contributions]]
kind = "view"
id = "main"
title = "Activity monitor"

[[contributions]]
kind = "view"
id = "block"
title = "Activity monitor (block graphs)"

[[contributions]]
kind = "view"
id = "ascii"
title = "Activity monitor (ASCII graphs)"
