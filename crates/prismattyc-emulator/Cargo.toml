[package]
name = "prismattyc-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
flate2 = "1"
libc = "0.2"
portable-pty.workspace = true
png = "0.17"
prismattyc-core = { path = "../prismattyc-core" }
prismattyc-protocol = { path = "../prismattyc-protocol" }
serde.workspace = true
vte.workspace = true

[target.'cfg(unix)'.dependencies]
# The same version portable-pty already uses; read-only termios flags.
nix = { version = "0.28", features = ["term"] }

[dev-dependencies]
serde_json = "1.0.151"
