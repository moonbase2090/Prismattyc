[workspace]
exclude = ["third_party/portable-pty"]
members = [
    "crates/prismattyc",
    "crates/prismattyc-core",
    "crates/prismattyc-emulator",
    "crates/prismattyc-host",
    "crates/prismattyc-labs",
    "crates/prismattyc-mux",
    "crates/prismattyc-protocol",
    "crates/prismattyc-render",
    "crates/prismattyc-rich-client",
    "crates/pmux-mcp",
    "crates/prismattyc-winres",
    "crates/prismattyc-cmd-forwarder",
]
resolver = "2"

[workspace.package]
version = "0.3.53"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
vte = "0.15"

[profile.mutants]
inherits = "test"
debug = "none"

[patch.crates-io]
portable-pty = { path = "third_party/portable-pty" }
