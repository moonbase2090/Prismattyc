  crap:
    name: CRAP
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # act mounts the Docker socket for container jobs. The fallback needs
    # that socket to read the host worktree gitdir in a read-only sidecar.
    # --init so pid 1 reaps (PT-259).
    env:
      LA_HEAVY: "1"
      LA_HEAVY_JOB: crap
    container:
      image: local-actions-runner:latest
      options: --init -v /tmp/prismattyc-la:/tmp/prismattyc-la
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire heavy-job lock (PT-305)
        run: python3 scripts/la-heavy-serial.py --acquire --wait --job crap

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup component add llvm-tools-preview

      - name: Install real-window test display
        run: ./scripts/install-render-test-deps.sh

      - name: Install cargo-llvm-cov and cargo-crap
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          command -v cargo-llvm-cov >/dev/null 2>&1 \
            || cargo install cargo-llvm-cov --version 0.9.0
          command -v cargo-crap >/dev/null 2>&1 \
            || cargo install cargo-crap --version 0.4.3

      - name: CRAP gate unit tests
        run: |
          python3 scripts/crap-gate_test.py
          python3 scripts/crap-changed-files_test.py

      - name: Coverage LCOV and CRAP report
        env:
          PRISMATTYC_TEST_TIME_SCALE: "4"
        run: |
          set -euo pipefail
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          mkdir -p build
          cargo llvm-cov --workspace --locked --lcov --output-path build/crap-lcov.info
          cargo crap --workspace \
            --lcov build/crap-lcov.info \
            --format json \
            --sort file \
            --output build/crap-current.json

      - name: Gate against committed baseline
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/crap-changed-files.sh > build/crap-changed.txt
          python3 scripts/crap-gate.py \
            --baseline docs/crap-baseline.json \
            --current build/crap-current.json \
            --changed-files-from build/crap-changed.txt \
            --repo "$PWD"

      - name: Export crap-current.json onto the host worktree
        if: success()
        run: |
          set -euo pipefail
          test -f build/crap-current.json
          copy_ok=0
          if docker info >/dev/null 2>&1; then
            dkr() { docker "$@"; }
            copy_ok=1
          elif sudo -n docker info >/dev/null 2>&1; then
            dkr() { sudo -n docker "$@"; }
            copy_ok=1
          fi
          if [ "$copy_ok" -eq 1 ]; then
            if dkr run --rm -i -v "$PWD/build:/host-build" alpine:latest \
              tee /host-build/crap-current.json >/dev/null < build/crap-current.json
            then
              echo "host worktree build/crap-current.json updated"
            else
              echo "warning: docker copy failed; gate already passed; file remains at $PWD/build/crap-current.json"
            fi
          else
            echo "crap-current.json already at $PWD/build/crap-current.json"
          fi

      - name: Release heavy-job lock
        if: always()
        run: python3 scripts/la-heavy-serial.py --release --job crap

  crap-refresh:
    name: CRAP refresh
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Job container so act attaches the host Docker socket and the
    # written baseline can be copied onto the host worktree.
    env:
      LA_HEAVY: "1"
      LA_HEAVY_JOB: crap-refresh
    container:
      image: local-actions-runner:latest
      options: --privileged --init -v /tmp/prismattyc-la:/tmp/prismattyc-la
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Acquire heavy-job lock (PT-305)
        run: python3 scripts/la-heavy-serial.py --acquire --wait --job crap-refresh

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup component add llvm-tools-preview

      - name: Install real-window test display
        run: ./scripts/install-render-test-deps.sh

      - name: Install cargo-llvm-cov and cargo-crap
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          command -v cargo-llvm-cov >/dev/null 2>&1 \
            || cargo install cargo-llvm-cov --version 0.9.0
          command -v cargo-crap >/dev/null 2>&1 \
            || cargo install cargo-crap --version 0.4.3

      - name: Refresh baseline and copy onto the host worktree
        run: |
          set -euo pipefail
          if env -u GITHUB_ACTOR CRAP_REFRESH_IN_RUNNER= ./scripts/crap-refresh.sh; then
            echo "error: crap-refresh.sh must refuse outside the runner" >&2
            exit 1
          fi
          CRAP_REFRESH_IN_RUNNER=1 ./scripts/crap-refresh.sh
          if docker info >/dev/null 2>&1; then
            dkr() { docker "$@"; }
          elif sudo -n docker info >/dev/null 2>&1; then
            dkr() { sudo -n docker "$@"; }
          else
            echo "error: docker is required to copy the baseline onto the host worktree" >&2
            exit 1
          fi
          dkr run --rm -i -v "$PWD/docs:/host-docs" alpine:latest \
            tee /host-docs/crap-baseline.json >/dev/null < docs/crap-baseline.json
          echo "host worktree docs/crap-baseline.json updated; commit it"

      - name: Release heavy-job lock
        if: always()
        run: python3 scripts/la-heavy-serial.py --release --job crap-refresh

  mutants:
    name: Mutants
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Job container so act attaches the host Docker socket. The overlay
    # copy has a worktree .git file whose gitdir lives on the host.
    # 8g here is the start cap. Act cannot interpolate env into
    # container.options. The next step applies MUTANTS_MEMORY (PT-261).
    # --init so pid 1 reaps. Without it, act's pid 1 is
    # `tail -f /dev/null` and HostConfig.Init is null (PT-259).
    # Keep 8g so the container dies before the 32 GiB host (PT-305).
    # Mutants scratch is multi-GiB. Bind host SSD cache into the
    # container. Do not use container /tmp (tmpfs). act cannot
    # interpolate env into container.options, so the host path is
    # fixed: /var/cache/prismattyc/mutants. Create it on disk or
    # symlink it to ${XDG_CACHE_HOME:-$HOME/.cache}/prismattyc/mutants.
    env:
      LA_HEAVY: "1"
      LA_HEAVY_JOB: mutants
      MUTANTS_TMPDIR: /cache/prismattyc/mutants
      TMPDIR: /cache/prismattyc/mutants
    container:
      image: local-actions-runner:latest
      options: --privileged --init -v /tmp/prismattyc-la:/tmp/prismattyc-la -v /var/cache/prismattyc/mutants:/cache/prismattyc/mutants --memory=8g
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire heavy-job lock (PT-305)
        run: python3 scripts/la-heavy-serial.py --acquire --wait --job mutants

      - name: Check host headroom (PT-305)
        run: python3 scripts/mutants-gate.py --check-host-headroom

      - name: Check mutants scratch is not tmpfs (PT-305)
        run: |
          mkdir -p "${MUTANTS_TMPDIR}"
          python3 scripts/mutants-gate.py --check-tmpdir

      - name: Apply MUTANTS_MEMORY cap
        run: |
          set -euo pipefail
          mem="${MUTANTS_MEMORY:-8g}"
          cid="$(hostname)"
          if docker info >/dev/null 2>&1 && docker inspect "$cid" >/dev/null 2>&1; then
            docker update --memory="$mem" "$cid"
          fi
          python3 scripts/mutants-gate.py \
            --check-memory-cap \
            --requested-memory "$mem"

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux

      - name: Install real-window test display
        run: ./scripts/install-render-test-deps.sh

      - name: Install cargo-mutants
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          command -v cargo-mutants >/dev/null 2>&1 \
            || cargo install cargo-mutants --locked --version 27.1.0

      - name: Syntax-check mutants scripts
        run: |
          bash -n scripts/mutants-pr.sh
          bash -n scripts/mutants-nightly.sh
          bash -n scripts/la-staged-pr.sh
          bash -n scripts/la-reclaim-host.sh
          bash -n scripts/la-reclaim-zram.sh

      - name: Mutants gate unit tests
        run: |
          python3 scripts/mutants-gate_test.py
          python3 scripts/mutants-route_test.py
          python3 scripts/la-heavy-serial_test.py
          python3 scripts/la-staged_test.py

      - name: cargo mutants --in-diff on touched crates
        env:
          LA_HEAVY_HELD: "1"
        run: ./scripts/mutants-pr.sh

      - name: Release heavy-job lock
        if: always()
        run: python3 scripts/la-heavy-serial.py --release --job mutants
