disallowed-methods = [
    { path = "std::process::Command::spawn", reason = "use prismattyc_process::spawn" },
    { path = "std::process::Command::output", reason = "use capture_command before stream overrides, then spawn and wait_with_output" },
    { path = "std::process::Command::status", reason = "use prismattyc_process::status" },
    { path = "std::os::unix::process::CommandExt::exec", allow-invalid = true, reason = "use prismattyc_process::exec" },
    { path = "libc::fork", allow-invalid = true }, { path = "libc::vfork", allow-invalid = true }, { path = "libc::posix_spawn", allow-invalid = true }, { path = "libc::posix_spawnp", allow-invalid = true },
    { path = "libc::execl", allow-invalid = true }, { path = "libc::execle", allow-invalid = true }, { path = "libc::execlp", allow-invalid = true }, { path = "libc::execv", allow-invalid = true }, { path = "libc::execve", allow-invalid = true },
    { path = "libc::execvp", allow-invalid = true }, { path = "libc::execvpe", allow-invalid = true }, { path = "libc::fexecve", allow-invalid = true }, { path = "libc::execveat", allow-invalid = true },
    { path = "libc::system", allow-invalid = true }, { path = "libc::popen", allow-invalid = true }, { path = "libc::syscall", allow-invalid = true }, { path = "libc::forkpty", allow-invalid = true },
    { path = "nix::unistd::fork", allow-invalid = true },
    { path = "nix::unistd::execv", allow-invalid = true },
    { path = "nix::unistd::execve", allow-invalid = true },
    { path = "nix::unistd::execvp", allow-invalid = true },
    { path = "nix::unistd::execvpe", allow-invalid = true },
    { path = "nix::unistd::fexecve", allow-invalid = true },
    { path = "nix::spawn::posix_spawn", allow-invalid = true },
    { path = "nix::spawn::posix_spawnp", allow-invalid = true },
    { path = "rustix::runtime::fork", allow-invalid = true },
    { path = "rustix::runtime::execve", allow-invalid = true },
    { path = "rustix::runtime::execveat", allow-invalid = true },
]
