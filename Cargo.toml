[workspace]
exclude = ["third_party/portable-pty", "tools/activity-monitor"]
members = [
    "crates/prismattyc",
    "crates/prismattyc-core",
    "crates/prismattyc-emulator",
    "crates/prismattyc-host",
    "crates/prismattyc-labs",
    "crates/prismattyc-mux",
    "crates/prismattyc-protocol",
    "crates/prismattyc-render",
    "crates/prismattyc-rich-client",
    "crates/pmux-mcp",
    "crates/pmux-plugin-api",
    "crates/pmux-plugin-runtime",
    "crates/pmux-plugin-fixture",
    "crates/pmux-activity-monitor-plugin",
    "crates/pmux-activity-connector-plugin",
    "crates/prismattyc-winres",
    "crates/prismattyc-cmd-forwarder",
]
resolver = "2"

[workspace.package]
version = "0.3.64"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
vte = "0.15"
lunatui-core = { git = "https://github.com/moonbase2090/lunatui", rev = "d847e749eb773f7d48edd7d9e429bcc9cbe9e898" }
lunatui-image = { git = "https://github.com/moonbase2090/lunatui", rev = "d847e749eb773f7d48edd7d9e429bcc9cbe9e898" }
lunatui-term = { git = "https://github.com/moonbase2090/lunatui", rev = "d847e749eb773f7d48edd7d9e429bcc9cbe9e898" }
lunatui-theme = { git = "https://github.com/moonbase2090/lunatui", rev = "d847e749eb773f7d48edd7d9e429bcc9cbe9e898" }
lunatui-widgets = { git = "https://github.com/moonbase2090/lunatui", rev = "d847e749eb773f7d48edd7d9e429bcc9cbe9e898", default-features = false, features = ["pixel-sparkline", "canvas"] }

[profile.mutants]
inherits = "test"
debug = "none"

[patch.crates-io]
portable-pty = { path = "third_party/portable-pty" }
