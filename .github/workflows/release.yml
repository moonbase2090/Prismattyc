name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Full release tag to build, such as v0.2.20
        required: true
        type: string
      dry_run:
        description: Build, sign, and notarize without publishing
        default: true
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      base_version: ${{ steps.release.outputs.base_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and dispatch mode
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts/release')
          from release_version import parse_release_version

          tag = os.environ['RELEASE_TAG']
          if not tag.startswith('v'):
              raise SystemExit('release tag must start with v')
          try:
              version, base_version = parse_release_version(tag)
          except ValueError as error:
              raise SystemExit(str(error)) from error
          if version != tag[1:]:
              raise SystemExit('release tag must use canonical semver spelling')
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              if os.environ.get('RELEASE_DRY_RUN') != 'true' and (
                  os.environ.get('GITHUB_REF_TYPE') != 'tag'
                  or os.environ.get('GITHUB_REF_NAME') != tag
              ):
                  raise SystemExit('publishing requires dispatching the matching existing tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\nversion={version}\nbase_version={base_version}\n')
          print(f'Validated {tag}; binaries may report {base_version} for a prerelease.')
          PY

  apple:
    name: Apple universal app
    needs: validate
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm Apple SDK
        run: scripts/release/confirm-apple-sdk.sh

      - name: Install Rust toolchain and Apple targets
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, Rust 1.90.0
        with:
          toolchain: 1.90.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dmgbuild
        run: python3 -m pip install --disable-pip-version-check 'dmgbuild==1.6.7'

      - name: Build both Apple architectures
        env:
          # Keep the product runnable on macOS 11+ even when linking a current SDK.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cargo build --release --locked --workspace --bins --target aarch64-apple-darwin
          cargo build --release --locked --workspace --bins --target x86_64-apple-darwin
          # Record the SDK the arm64 host was linked against for the logs.
          otool -l target/aarch64-apple-darwin/release/prismattyc-host |
            awk '/LC_BUILD_VERSION/{p=1} p&&/sdk/{print; exit}'

      - name: Sign, notarize, staple, and package
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BASE_VERSION: ${{ needs.validate.outputs.base_version }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          scripts/release/package-apple.sh \
            "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_BASE_VERSION" target dist

      - name: Upload Apple release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-apple
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-macos
            dist/manifest-macos-universal.json
          if-no-files-found: error
          retention-days: 7

      - name: Mark Apple assets signed
        id: signed
        if: success()
        run: echo 'signed=true' >> "$GITHUB_OUTPUT"

    outputs:
      signed: ${{ steps.signed.outputs.signed }}

  linux-x86_64:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, Rust 1.90.0
        with:
          toolchain: 1.90.0
          targets: x86_64-unknown-linux-gnu

      - name: Install cargo-zigbuild and Zig
        run: scripts/release/setup-zigbuild.sh

      - name: Install manual generator
        run: |
          sudo apt-get update
          sudo apt-get install --yes help2man

      - name: Build and package Linux x86_64
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARGET: x86_64-unknown-linux-gnu
        run: |
          scripts/release/build-linux.sh "$TARGET"
          scripts/release/smoke-linux-al2023.sh "target/$TARGET/release"
          PRISMATTYC_BINS="target/$TARGET/release" \
            PMUX_MAN_DIR=build/release-man scripts/install-man.sh
          python3 scripts/release/package.py \
            --version "$RELEASE_VERSION" \
            --target "$TARGET" \
            --bin-dir "target/$TARGET/release" \
            --man-dir build/release-man \
            --out dist/linux-x86_64

      - name: Upload Linux x86_64 release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-linux-x86_64
          path: |
            dist/linux-x86_64/*
            !dist/linux-x86_64/SHA256SUMS
            !dist/linux-x86_64/MPL-2.0.txt
            !dist/linux-x86_64/NOTICE.txt
          if-no-files-found: error
          retention-days: 7

  linux-arm64:
    name: Linux ARM64
    needs: validate
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, Rust 1.90.0
        with:
          toolchain: 1.90.0
          targets: aarch64-unknown-linux-gnu

      - name: Install cargo-zigbuild and Zig
        run: scripts/release/setup-zigbuild.sh

      - name: Install manual generator
        run: |
          sudo apt-get update
          sudo apt-get install --yes help2man

      - name: Build and package Linux ARM64
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TARGET: aarch64-unknown-linux-gnu
        run: |
          scripts/release/build-linux.sh "$TARGET"
          scripts/release/smoke-linux-al2023.sh "target/$TARGET/release"
          PRISMATTYC_BINS="target/$TARGET/release" \
            PMUX_MAN_DIR=build/release-man scripts/install-man.sh
          python3 scripts/release/package.py \
            --version "$RELEASE_VERSION" \
            --target "$TARGET" \
            --bin-dir "target/$TARGET/release" \
            --man-dir build/release-man \
            --out dist/linux-arm64

      - name: Upload Linux ARM64 release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-linux-arm64
          path: |
            dist/linux-arm64/*
            !dist/linux-arm64/SHA256SUMS
            !dist/linux-arm64/MPL-2.0.txt
            !dist/linux-arm64/NOTICE.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Build native Windows package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/release/build-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Upload Windows x64 release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-windows-x64
          path: build/windows-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [validate, apple, linux-x86_64, linux-arm64, windows]
    if: >-
      ${{
        needs.apple.outputs.signed == 'true' &&
        !(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
        (github.event_name != 'workflow_dispatch' || github.ref_type == 'tag')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create release checksums
        run: |
          set -euo pipefail
          asset_count=$(find dist -maxdepth 1 -type f | wc -l)
          if [[ "$asset_count" -eq 0 ]]; then
            echo 'no release assets were downloaded' >&2
            exit 1
          fi
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" dist/*
