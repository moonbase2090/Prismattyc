manifest_version = 1
id = "org.moonbase.runtime-fixture"
version = "1.0.0"
plugin_api = "^1"
component = "fixture.wasm"
notices = ["LICENSE"]
[requires]
"pmux:activity/read" = "^1"
"pmux:view/frame" = "^1"
"pmux:tool/call" = "^1"
[[contributions]]
kind = "view"
id = "main"
title = "Runtime fixture"
[[contributions]]
kind = "command"
id = "poll"
mcp_name = "fixture_poll"
input_schema = "input.json"
output_schema = "output.json"
[[contributions]]
kind = "command"
id = "loop"
mcp_name = "fixture_loop"
input_schema = "input.json"
output_schema = "output.json"
[[contributions]]
kind = "command"
id = "grow"
mcp_name = "fixture_grow"
input_schema = "input.json"
output_schema = "output.json"
[[contributions]]
kind = "command"
id = "counter"
mcp_name = "fixture_counter"
input_schema = "input.json"
output_schema = "output.json"
