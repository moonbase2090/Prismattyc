[package]
name = "pmux-mcp"
description = "MCP stdio adapter over the pmux Mail* socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/moonbase2090/Prismattyc"


[dependencies]
rmcp = { version = "3.7", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["derive"] }
serde = { workspace = true }
serde_json = "1"
prismattyc-core = { path = "../prismattyc-core" }
prismattyc-mux = { path = "../prismattyc-mux" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
http-body-util = "0.1"
tower-service = "0.3"

[[bin]]
name = "pmux-mcp"
path = "src/main.rs"

[build-dependencies]
prismattyc-winres = { path = "../prismattyc-winres" }
