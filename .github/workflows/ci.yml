name: CI

# GitHub-hosted minutes are paused until the billing month resets.
# Local Actions (act + Docker) is the merge gate. Same file, same jobs.
# Jobs no-op on github.com (actor is the pusher). Local Actions passes
# --actor nektos/act. Restore GHA by deleting the per-job `if`.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Split into a few jobs so local-actions can queue/run them independently
# (and GHA can parallelize when it is turned back on).
# On the 32 GiB Nexus host, do not fire the full matrix in one shot.
# Use scripts/la-staged-pr.sh (PT-305).
env:
  RUSTUP_TOOLCHAIN: "1.90.0"
  # Containment for the mutants job, not an OOM fix (PT-261). Measured
  # --jobs 1 host peak: 4.56 GiB compile, 1.31 GiB link, 0.23 GiB execute.
  # Default 8g. Do not raise it (PT-286, PT-305). Override via act --env
  # without editing container.options.
  MUTANTS_MEMORY: "8g"

jobs:
  format:
    name: Format
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            # shellcheck source=/dev/null
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            # shellcheck source=/dev/null
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          rustup default 1.90.0

      - name: Check formatting
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo fmt --all -- --check

  check:
    name: Check
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Check workspace
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo check --workspace --locked

      - name: Check prismattyc-host gpu feature
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo check -p prismattyc-host --features gpu --locked

      - name: Check prismattyc-labs on wasm32
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          cargo check -p prismattyc-labs --target wasm32-unknown-unknown --locked

  test:
    name: Test
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux

      - name: Install real-window test display
        run: ./scripts/install-render-test-deps.sh

      - name: Test workspace
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo test --workspace --locked

  # Frozen rich harness pin. Not a light-stage / PRD §5.6 / A-6 gate.
  # Hand / Local Actions: --event pull_request --job phase3-rich
  # Periodic: .github/workflows/phase3-rich-nightly.yml
  phase3-rich:
    name: Phase 3 rich harness
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux

      - name: Run test-phase3-rich.sh
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          ./scripts/test-phase3-rich.sh

      - name: Run test-phase3-transport.sh
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          ./scripts/test-phase3-transport.sh

  lint:
    name: Lint
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          rustup default 1.90.0

      - name: Lint workspace
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo clippy --workspace --all-targets --locked -- -D warnings

  # Windows CI guard (PT-101). Cross-compile + Wine. Not a Windows container.
  # Portable set (named with -p below): prismattyc-core, prismattyc-protocol,
  # prismattyc-emulator, prismattyc-render, prismattyc-labs,
  # prismattyc-rich-client.
  # Excluded (lift crate-by-crate in PT-180; no stubs here):
  # - prismattyc-mux: pmux/pmuxd/pmux-attach import Unix sockets and PTY types
  # - prismattyc-host: attach_log uses UnixStream; main.rs names unix-only mux symbols
  # - prismattyc: classic expand_empty_paste is a unix-only mux export
  # - pmux-mcp: Mail* UnixStream
  windows-check:
    name: Windows check
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain and MinGW
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            # shellcheck source=/dev/null
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            # shellcheck source=/dev/null
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "error: x86_64-w64-mingw32-gcc is missing after install" >&2
            exit 1
          fi
          if ! rustup target list --installed | grep -qx 'x86_64-pc-windows-gnu'; then
            echo "error: rustup target x86_64-pc-windows-gnu is missing after install" >&2
            exit 1
          fi

      - name: Check portable crates for Windows GNU
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "error: x86_64-w64-mingw32-gcc is missing" >&2
            exit 1
          fi
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          cargo check --locked --target x86_64-pc-windows-gnu \
            -p prismattyc-core \
            -p prismattyc-protocol \
            -p prismattyc-emulator \
            -p prismattyc-render \
            -p prismattyc-labs \
            -p prismattyc-rich-client

  windows-test:
    name: Windows test
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain, MinGW, and Wine
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            # shellcheck source=/dev/null
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            # shellcheck source=/dev/null
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 wine64
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "error: x86_64-w64-mingw32-gcc is missing after install" >&2
            exit 1
          fi
          if ! rustup target list --installed | grep -qx 'x86_64-pc-windows-gnu'; then
            echo "error: rustup target x86_64-pc-windows-gnu is missing after install" >&2
            exit 1
          fi
          wine_bin=""
          if command -v wine64 >/dev/null 2>&1; then
            wine_bin="$(command -v wine64)"
          elif command -v wine >/dev/null 2>&1; then
            wine_bin="$(command -v wine)"
          elif [ -x /usr/lib/wine/wine64 ]; then
            wine_bin=/usr/lib/wine/wine64
          fi
          if [ -z "$wine_bin" ]; then
            echo "error: wine64 is missing after install" >&2
            echo "error: also looked for wine and /usr/lib/wine/wine64" >&2
            exit 1
          fi
          echo "using wine runner: ${wine_bin}"

      - name: Build Windows GNU test binaries
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "error: x86_64-w64-mingw32-gcc is missing" >&2
            exit 1
          fi
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          cargo test --locked --no-run --tests --target x86_64-pc-windows-gnu \
            --message-format=json \
            -p prismattyc-core \
            -p prismattyc-protocol \
            -p prismattyc-emulator \
            -p prismattyc-render \
            -p prismattyc-labs \
            -p prismattyc-rich-client \
            > "${RUNNER_TEMP:-/tmp}/windows-gnu-test-build.json"

      - name: Run Windows GNU test binaries under Wine
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          wine_bin=""
          if command -v wine64 >/dev/null 2>&1; then
            wine_bin="$(command -v wine64)"
          elif command -v wine >/dev/null 2>&1; then
            wine_bin="$(command -v wine)"
          elif [ -x /usr/lib/wine/wine64 ]; then
            wine_bin=/usr/lib/wine/wine64
          fi
          if [ -z "$wine_bin" ]; then
            echo "error: wine64 is missing" >&2
            echo "error: also looked for wine and /usr/lib/wine/wine64" >&2
            exit 1
          fi
          export WINE_BIN="$wine_bin"
          export WINEDEBUG=-all
          export WINEPREFIX="${RUNNER_TEMP:-/tmp}/pmux-wine"
          mkdir -p "$WINEPREFIX"
          python3 - "${RUNNER_TEMP:-/tmp}/windows-gnu-test-build.json" <<'PY'
          import json, os, subprocess, sys

          json_path = sys.argv[1]
          exes = []
          with open(json_path, encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      msg = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if msg.get("reason") != "compiler-artifact":
                      continue
                  if not msg.get("profile", {}).get("test"):
                      continue
                  executable = msg.get("executable")
                  if executable:
                      exes.append(executable)
          if not exes:
              raise SystemExit("no Windows GNU test executables in cargo json")
          wine_bin = os.environ.get("WINE_BIN")
          if not wine_bin:
              raise SystemExit("error: wine64 is missing")
          for exe in exes:
              print(f"{wine_bin} {exe}", flush=True)
              subprocess.run([wine_bin, exe, "--test-threads", "1"], check=True)
          PY

  spaces-e2e:
    name: Spaces e2e (PT-219)
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job container: act attaches the host Docker socket. Fail if the
    # image is missing; do not skip.
    env:
      LA_HEAVY: "1"
      LA_HEAVY_JOB: spaces-e2e
    container:
      image: local-actions-runner:latest
      options: --privileged --init -v /tmp/prismattyc-la:/tmp/prismattyc-la
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Acquire heavy-job lock (PT-305)
        run: python3 scripts/la-heavy-serial.py --acquire --wait --job spaces-e2e

      - name: Syntax-check spaces and host UX fixtures
        run: |
          bash -n tests/native/spaces-e2e.sh
          bash -n tests/native/host-ux-e2e.sh
          bash -n tests/native/docker/run.sh
          PYTHONPYCACHEPREFIX=build/python-cache python3 -m py_compile tests/native/host-ux-e2e.py
          PYTHONPYCACHEPREFIX=build/python-cache python3 -m py_compile tests/native/restart-spaces-e2e.py

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Build host and mux bins
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo build --locked -p prismattyc-host -p prismattyc-mux --bins

      - name: Run spaces and host UX e2e in the native test container
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            dkr() { docker "$@"; }
          elif sudo -n docker info >/dev/null 2>&1; then
            dkr() { sudo -n docker "$@"; }
          else
            echo "error: docker is not available in this runner" >&2
            exit 1
          fi
          if ! dkr image inspect prismattyc-native-tests >/dev/null 2>&1; then
            echo "error: image prismattyc-native-tests is missing (tests/native/docker/run.sh build)" >&2
            exit 1
          fi
          # Act copies the workspace; host docker does not see overlay files.
          # Stage bins and scripts onto a host path, then run run.sh in a
          # sidecar that bind-mounts that same path (PT-219).
          host_root="/tmp/prismattyc-spaces-e2e-$$"
          trap "dkr run --rm -v /tmp:/tmp alpine:latest rm -rf '$host_root'" EXIT
          dkr run --rm -v "$host_root:$host_root" alpine:latest \
            mkdir -p "$host_root/bins" "$host_root/tests/native/docker"
          tar -C "$PWD/target/debug" -cf - pmux pmuxd pmux-attach prismattyc-host \
            | dkr run --rm -i -v "$host_root:$host_root" alpine:latest \
              tar -C "$host_root/bins" -xf -
          tar -C "$PWD/tests/native" -cf - spaces-e2e.sh host-ux-e2e.sh host-ux-e2e.py space-open-race.py restart-spaces-e2e.py docker/run.sh \
            | dkr run --rm -i -v "$host_root:$host_root" alpine:latest \
              tar -C "$host_root/tests/native" -xf -
          dkr run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$host_root:$host_root" \
            -v "$PWD/build/host-ux-e2e:$host_root/build/host-ux-e2e" \
            -e PRISMATTYC_BINS="$host_root/bins" \
            -e WIGGLE="${WIGGLE:-0}" \
            -w "$host_root" \
            -u 0 \
            local-actions-runner:latest \
            bash -c 'bash tests/native/docker/run.sh spaces-e2e && bash tests/native/docker/run.sh host-ux-e2e'
          # The nested artifact mount writes to the host checkout. It survives
          # removal of both job containers and the temporary staging path.
          echo "Host UX artifacts: $PWD/build/host-ux-e2e"

      - name: Release heavy-job lock
        if: always()
        run: python3 scripts/la-heavy-serial.py --release --job spaces-e2e

  walkthrough-caption-e2e:
    name: Walkthrough caption e2e (PT-297)
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same X11 native test container as spaces-e2e. Fail if the image is missing.
    env:
      LA_HEAVY: "1"
      LA_HEAVY_JOB: walkthrough-caption-e2e
    container:
      image: local-actions-runner:latest
      options: --privileged --init -v /tmp/prismattyc-la:/tmp/prismattyc-la
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Acquire heavy-job lock (PT-305)
        run: python3 scripts/la-heavy-serial.py --acquire --wait --job walkthrough-caption-e2e

      - name: Syntax-check tests/native/walkthrough-caption-e2e.sh
        run: bash -n tests/native/walkthrough-caption-e2e.sh && bash -n tests/native/docker/run.sh

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Build host and mux bins
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo build --locked -p prismattyc-host -p prismattyc-mux --bins

      - name: Run walkthrough caption e2e in the native test container
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            dkr() { docker "$@"; }
          elif sudo -n docker info >/dev/null 2>&1; then
            dkr() { sudo -n docker "$@"; }
          else
            echo "error: docker is not available in this runner" >&2
            exit 1
          fi
          if ! dkr image inspect prismattyc-native-tests >/dev/null 2>&1; then
            echo "error: image prismattyc-native-tests is missing (tests/native/docker/run.sh build)" >&2
            exit 1
          fi
          host_root="/tmp/prismattyc-walkthrough-caption-e2e-$$"
          trap "dkr run --rm -v /tmp:/tmp alpine:latest rm -rf '$host_root'" EXIT
          dkr run --rm -v "$host_root:$host_root" alpine:latest \
            mkdir -p "$host_root/bins" "$host_root/tests/native/docker"
          tar -C "$PWD/target/debug" -cf - pmux pmuxd pmux-attach prismattyc-host \
            | dkr run --rm -i -v "$host_root:$host_root" alpine:latest \
              tar -C "$host_root/bins" -xf -
          tar -C "$PWD/tests/native" -cf - walkthrough-caption-e2e.sh docker/run.sh \
            | dkr run --rm -i -v "$host_root:$host_root" alpine:latest \
              tar -C "$host_root/tests/native" -xf -
          dkr run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$host_root:$host_root" \
            -e PRISMATTYC_BINS="$host_root/bins" \
            -w "$host_root" \
            -u 0 \
            local-actions-runner:latest \
            bash "$host_root/tests/native/docker/run.sh" walkthrough-caption-e2e

      - name: Release heavy-job lock
        if: always()
        run: python3 scripts/la-heavy-serial.py --release --job walkthrough-caption-e2e

  spaces-e2e-wayland:
    # PT-290: weston headless --socket=pt290-wayland.
    # Run 1: window_opacity 0.95, native wl_shm. Fail on XWayland or
    # softbuffer. Run 2: opacity 1.0, blur off; startup line is not
    # wl_shm; dismiss splash, type, no splash pixels across two
    # presents (PT-294). Not --privileged (PT-278). See
    # docs/testing-policy.md.
    name: Spaces e2e Wayland (PT-290)
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LA_HEAVY: "1"
      LA_HEAVY_JOB: spaces-e2e-wayland
    container:
      image: local-actions-runner:latest
      options: --privileged --init -v /tmp/prismattyc-la:/tmp/prismattyc-la
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Acquire heavy-job lock (PT-305)
        run: python3 scripts/la-heavy-serial.py --acquire --wait --job spaces-e2e-wayland

      - name: Syntax-check tests/native/spaces-e2e-wayland.sh
        run: bash -n tests/native/spaces-e2e-wayland.sh && bash -n tests/native/docker/run.sh

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Build host and mux bins
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          cargo build --locked -p prismattyc-host -p prismattyc-mux --bins

      - name: Run Wayland shm e2e in the native test container
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            dkr() { docker "$@"; }
          elif sudo -n docker info >/dev/null 2>&1; then
            dkr() { sudo -n docker "$@"; }
          else
            echo "error: docker is not available in this runner" >&2
            exit 1
          fi
          if ! dkr image inspect prismattyc-native-tests >/dev/null 2>&1; then
            echo "error: image prismattyc-native-tests is missing (tests/native/docker/run.sh build)" >&2
            exit 1
          fi
          host_root="/tmp/prismattyc-spaces-e2e-wayland-$$"
          trap "dkr run --rm -v /tmp:/tmp alpine:latest rm -rf '$host_root'" EXIT
          dkr run --rm -v "$host_root:$host_root" alpine:latest \
            mkdir -p "$host_root/bins" "$host_root/tests/native/docker"
          tar -C "$PWD/target/debug" -cf - pmux pmuxd pmux-attach prismattyc-host \
            | dkr run --rm -i -v "$host_root:$host_root" alpine:latest \
              tar -C "$host_root/bins" -xf -
          tar -C "$PWD/tests/native" -cf - spaces-e2e-wayland.sh docker/run.sh docker/sway-headless.conf \
            | dkr run --rm -i -v "$host_root:$host_root" alpine:latest \
              tar -C "$host_root/tests/native" -xf -
          dkr run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$host_root:$host_root" \
            -e PRISMATTYC_BINS="$host_root/bins" \
            -w "$host_root" \
            -u 0 \
            local-actions-runner:latest \
            bash "$host_root/tests/native/docker/run.sh" spaces-e2e-wayland

      - name: Release heavy-job lock
        if: always()
        run: python3 scripts/la-heavy-serial.py --release --job spaces-e2e-wayland

  render-bench:
