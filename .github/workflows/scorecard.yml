name: scorecard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `&& 0 || 1` is wrong in GHA expressions (0 is falsy); PR --diff needs full history.
          fetch-depth: 0
      - name: Install sc v0.1.5
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          asset=sc-v0.1.5-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/moonbase2090/Scorecard/releases/download/v0.1.5
          curl -fsSL -O "$base/$asset"
          curl -fsSL -O "$base/SHA256SUMS"
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xzf "$asset"
          mkdir -p "$HOME/.local/bin"
          install -m 755 sc sc-mcp "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install real-window test display
        run: ./scripts/install-render-test-deps.sh
      - name: Install Rust coverage tools
        run: |
          set -eu
          rustup toolchain install 1.90.0 --profile minimal --component llvm-tools --component clippy
          rustup default 1.90.0
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo llvm-cov --version
      - name: Analyze
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            if [ -z "${{ github.base_ref }}" ]; then
              base="origin/main"
            fi
            sc analyze . --diff "$base" --fail-on secrets,tests,lint,types \
              --format all --out scorecard.html --budget-seconds 900
          else
            sc analyze . --format all --out scorecard.html --fail-on "" \
              --budget-seconds 900
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-report
          if-no-files-found: error
          path: |
            scorecard.html
            scorecard.md
            scorecard.json
            scorecard.sarif
      - name: Upload SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
