name: Windows package
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact candidate commit to validate
        required: true
        type: string
      released_upgrade:
        description: Exercise upgrade from the released installer
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify source revision
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-f]{40}$') { throw 'Use a full commit hash.' }
          if ((git rev-parse HEAD) -ne $env:SOURCE_REF) { throw 'Unexpected source revision.' }
      - name: MSI helper tests
        shell: pwsh
        run: python scripts/release/windows_msi_test.py
      - name: Build unsigned validation package
        shell: pwsh
        run: ./scripts/release/build-windows.ps1
      - name: Validate installer lifecycle
        shell: pwsh
        env:
          RELEASED_UPGRADE: ${{ inputs.released_upgrade }}
        run: |
          $options = @{}
          if ($env:RELEASED_UPGRADE -eq 'true') {
            $asset = 'prismattyc-v0.3.34-x86_64-pc-windows-msvc.msi'
            Invoke-WebRequest "https://github.com/moonbase2090/Prismattyc/releases/download/v0.3.34/$asset" -OutFile build/released.msi
            Write-Output ('released_msi_sha256=' + (Get-FileHash build/released.msi -Algorithm SHA256).Hash)
            $options.ReleasedMsi = 'build/released.msi'
          }
          ./scripts/release/prove-windows-msi.ps1 -PackageDir build/windows-release -ProofPath build/msi-proof.txt @options
      - name: Upload proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: msi-validation-proof-${{ inputs.source_ref }}
          path: build/msi-proof.txt
          if-no-files-found: error
          retention-days: 7
