name: Mutants nightly

# Full workspace mutation, split across GitHub-hosted runners.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.90.0"

jobs:
  mutants-nightly:
    name: Mutants shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      LA_HEAVY: "1"
      LA_HEAVY_JOB: mutants-nightly
      MUTANTS_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, Node 24

      - name: Acquire heavy-job lock (PT-305)
        run: python3 scripts/la-heavy-serial.py --acquire --wait --job mutants-nightly

      - name: Check host headroom (PT-305)
        run: python3 scripts/mutants-gate.py --check-host-headroom

      - name: Check mutants scratch is not tmpfs (PT-305)
        run: |
          scratch="${MUTANTS_TMPDIR:-${XDG_CACHE_HOME:-$HOME/.cache}/prismattyc/mutants}"
          mkdir -p "${scratch}"
          MUTANTS_TMPDIR="${scratch}" TMPDIR="${scratch}" \
            python3 scripts/mutants-gate.py --check-tmpdir

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
          fi
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          if [ -f "$cargo_env" ]; then
            . "$cargo_env"
          elif [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0

      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux

      - name: Install real-window test display
        run: ./scripts/install-render-test-deps.sh

      - name: Install cargo-mutants
        run: |
          cargo_env="${CARGO_HOME:-$HOME/.cargo}/env"
          [ -f "$cargo_env" ] && . "$cargo_env"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          command -v cargo-mutants >/dev/null 2>&1 \
            || cargo install cargo-mutants --locked --version 27.1.0

      - name: Run cargo-mutants shard
        run: ./scripts/mutants-nightly.sh

      - name: Archive shard outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: mutants-nightly-shard-${{ matrix.shard }}
          path: build/mutants/shard-${{ matrix.shard }}/mutants.out/outcomes.json
          if-no-files-found: warn

      - name: Release heavy-job lock
        if: always()
        run: python3 scripts/la-heavy-serial.py --release --job mutants-nightly

  missed-mutants:
    name: Merge missed mutants
    if: ${{ always() }}
    needs: [mutants-nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0, Node 24

      - name: Download shard outcomes
        if: always()
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          pattern: mutants-nightly-shard-*
          path: build/mutant-shards
          merge-multiple: false

      - name: Merge shard outcomes
        if: always()
        run: >-
          python3 scripts/mutants-nightly-merge.py
          --input build/mutant-shards
          --output build/missed-mutants.txt
          --shards 8

      - name: Upload missed-mutant report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: mutants-nightly-missed
          path: build/missed-mutants.txt
          if-no-files-found: error
