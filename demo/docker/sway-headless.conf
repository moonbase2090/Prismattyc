# PT-290: headless sway for the Wayland box job.
# This is wlroots coverage, not owner-KWin equivalence. Buffer-release
# timing on KWin is an owner-machine check. See docs/testing-policy.md.
# Xwayland must stay off: a failed Xwayland start aborts sway in this
# image, and Xwayland is the path this job exists to reject.
xwayland disable
output HEADLESS-1 resolution 1920x1080
exec true
